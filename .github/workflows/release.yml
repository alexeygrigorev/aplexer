name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Cargo.lock currently resolves edition-2024 dependencies whose MSRV is
  # Rust 1.85, so pin the first toolchain that can build the locked graph.
  RUST_VERSION: "1.85.0"
  UV_VERSION: "0.12.5"
  MATURIN_VERSION: "1.14.1"
  AUDITWHEEL_VERSION: "6.8.1"
  TWINE_VERSION: "6.2.0"

jobs:
  check-versions:
    name: Verify release identities and versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check tag and both Python distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path.cwd()
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          projects = {
              "Cargo.toml": ("aplexer", root / "Cargo.toml", "package"),
              "python-cli/pyproject.toml": (
                  "aplexer",
                  root / "python-cli" / "pyproject.toml",
                  "project",
              ),
              "python/pyproject.toml": (
                  "aplexer-client",
                  root / "python" / "pyproject.toml",
                  "project",
              ),
          }
          errors = []
          for label, (expected_name, path, table) in projects.items():
              data = tomllib.loads(path.read_text(encoding="utf-8"))[table]
              name = data["name"]
              version = data["version"]
              print(f"{label}: name={name}, version={version}")
              if name != expected_name:
                  errors.append(f"{label} name is {name!r}, expected {expected_name!r}")
              if version != expected_version:
                  errors.append(
                      f"{label} version is {version!r}, tag requires {expected_version!r}"
                  )
          cli_project = tomllib.loads(
              (root / "python-cli" / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          expected_dependency = f"aplexer-client=={expected_version}"
          if cli_project.get("dependencies") != [expected_dependency]:
              errors.append(
                  "python-cli/pyproject.toml must have exactly one dependency, "
                  f"{expected_dependency!r}; found {cli_project.get('dependencies')!r}"
              )
          if errors:
              print("\n".join(f"::error::{error}" for error in errors))
              sys.exit(1)
          PY

  test:
    name: Test release inputs
    needs: check-versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Rust tests
        run: cargo test --locked --release --verbose

      - name: Run startup containment fault-injection tests
        run: >-
          cargo test --locked --release --features startup-test-hooks
          --test startup_rollback --test worker_startup_transaction
          --test lifecycle_failure --verbose

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run aplexer-client Python tests
        working-directory: python
        run: uv run --frozen --with pytest python -m pytest -q

      - name: Run aplexer CLI-wrapper Python tests
        working-directory: python-cli
        run: uv run --frozen --with pytest python -m pytest -q

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    container:
      # Dated PyPA images make the glibc baseline and bundled compilers/audit
      # policy reproducible. The arm64 job is native, not a cross build.
      image: ${{ matrix.container_image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2
            container_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7
            manylinux_tag: manylinux_2_28_x86_64

          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            # quay.io/pypa/manylinux_2_28_aarch64:2026.05.07-2
            container_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a435288af93def166dc59b5d052fa20ce59d76c6f38e8ad105767262d36843f0
            manylinux_tag: manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-manylinux-2-28

      - name: Install pinned wheel tooling
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install \
            --disable-pip-version-check \
            "auditwheel==${AUDITWHEEL_VERSION}" \
            "maturin==${MATURIN_VERSION}"

      - name: Build native release binaries
        run: cargo build --locked --release --bins --target "${{ matrix.target }}"

      - name: Verify native binaries
        run: |
          "target/${{ matrix.target }}/release/a" --version
          "target/${{ matrix.target }}/release/aplexer" --version

      - name: Stage native binaries
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/a" staging/a
          cp "target/${{ matrix.target }}/release/aplexer" staging/aplexer

      - name: Build and audit aplexer CLI wheel
        run: |
          mkdir -p cli-native-dist cli-dist
          /opt/python/cp311-cp311/bin/python scripts/build-wheels.py \
            --platform "${{ matrix.platform }}" \
            --binaries-dir staging \
            --output-dir cli-native-dist
          native_wheels=(cli-native-dist/*.whl)
          test "${#native_wheels[@]}" -eq 1
          /opt/python/cp311-cp311/bin/python -m auditwheel repair \
            --plat "${{ matrix.manylinux_tag }}" \
            --only-plat \
            --wheel-dir cli-dist \
            "${native_wheels[0]}"
          repaired_wheels=(cli-dist/*.whl)
          test "${#repaired_wheels[@]}" -eq 1
          /opt/python/cp311-cp311/bin/python -m auditwheel show "${repaired_wheels[0]}"

      - name: Build and audit aplexer-client bindings wheel
        run: |
          mkdir -p client-dist
          (
            cd python
            /opt/python/cp311-cp311/bin/python -m maturin build \
              --release \
              --locked \
              --compatibility manylinux_2_28 \
              --out ../client-dist
          )
          client_wheels=(client-dist/*.whl)
          test "${#client_wheels[@]}" -eq 1
          case "$(basename "${client_wheels[0]}")" in
            aplexer_client-*) ;;
            *) echo "::error::bindings wheel is not the aplexer-client distribution"; exit 1 ;;
          esac
          /opt/python/cp311-cp311/bin/python -m auditwheel show "${client_wheels[0]}"

      - name: Cold-install aplexer and smoke-test its client dependency
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          /opt/python/cp311-cp311/bin/python -m venv wheel-test
          wheel-test/bin/python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links client-dist \
            cli-dist/*.whl
          wheel-test/bin/python - <<'PY'
          import os
          from importlib.metadata import version

          import aplexer
          import aplexer_cli

          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          assert version("aplexer") == expected
          assert version("aplexer-client") == expected
          assert aplexer is not None
          assert aplexer_cli is not None
          PY
          wheel-test/bin/a --version
          wheel-test/bin/aplexer --version

      - name: Upload native binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: aplexer-bins-${{ matrix.platform }}
          path: staging/*
          if-no-files-found: error

      - name: Upload aplexer CLI wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: aplexer-cli-wheel-${{ matrix.platform }}
          path: cli-dist/*.whl
          if-no-files-found: error

      - name: Upload aplexer-client bindings wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: aplexer-client-wheel-${{ matrix.platform }}
          path: client-dist/*.whl
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Collect and verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          for dir in artifacts/aplexer-bins-*; do
            platform="${dir#artifacts/aplexer-bins-}"
            cp "$dir/a" "release-assets/a-${platform}"
            cp "$dir/aplexer" "release-assets/aplexer-${platform}"
          done
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import sys

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          root = pathlib.Path("artifacts")
          expected = {
              f"aplexer-{version}-py3-none-manylinux_2_28_x86_64.whl",
              f"aplexer-{version}-py3-none-manylinux_2_28_aarch64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_x86_64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_aarch64.whl",
          }
          wheel_paths = list(root.rglob("*.whl"))
          found = {path.name: path for path in wheel_paths}
          if len(wheel_paths) != len(expected) or set(found) != expected:
              print(f"::error::wheel set mismatch: expected {sorted(expected)}, found {sorted(path.name for path in wheel_paths)}")
              sys.exit(1)
          for name, path in found.items():
              shutil.copy2(path, pathlib.Path("release-assets") / name)
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-testpypi:
    name: Publish both distributions to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Collect and verify both wheel matrices
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import sys

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {
              f"aplexer-{version}-py3-none-manylinux_2_28_x86_64.whl",
              f"aplexer-{version}-py3-none-manylinux_2_28_aarch64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_x86_64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_aarch64.whl",
          }
          wheel_paths = list(pathlib.Path("artifacts").rglob("*.whl"))
          paths = {path.name: path for path in wheel_paths}
          if len(wheel_paths) != len(expected) or set(paths) != expected:
              print(f"::error::wheel set mismatch: expected {sorted(expected)}, found {sorted(path.name for path in wheel_paths)}")
              sys.exit(1)
          client_output = pathlib.Path("dist/client")
          cli_output = pathlib.Path("dist/cli")
          client_output.mkdir(parents=True)
          cli_output.mkdir(parents=True)
          for name, path in paths.items():
              output = client_output if name.startswith("aplexer_client-") else cli_output
              shutil.copy2(path, output / name)
          PY
          uvx --from "twine==${TWINE_VERSION}" twine check dist/client/* dist/cli/*

      - name: Publish aplexer-client to TestPyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/client/

      - name: Publish dependent aplexer CLI to TestPyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/cli/

  publish-pypi:
    name: Publish both distributions to PyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Collect and verify both wheel matrices
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import sys

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {
              f"aplexer-{version}-py3-none-manylinux_2_28_x86_64.whl",
              f"aplexer-{version}-py3-none-manylinux_2_28_aarch64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_x86_64.whl",
              f"aplexer_client-{version}-cp311-abi3-manylinux_2_28_aarch64.whl",
          }
          wheel_paths = list(pathlib.Path("artifacts").rglob("*.whl"))
          paths = {path.name: path for path in wheel_paths}
          if len(wheel_paths) != len(expected) or set(paths) != expected:
              print(f"::error::wheel set mismatch: expected {sorted(expected)}, found {sorted(path.name for path in wheel_paths)}")
              sys.exit(1)
          client_output = pathlib.Path("dist/client")
          cli_output = pathlib.Path("dist/cli")
          client_output.mkdir(parents=True)
          cli_output.mkdir(parents=True)
          for name, path in paths.items():
              output = client_output if name.startswith("aplexer_client-") else cli_output
              shutil.copy2(path, output / name)
          PY
          uvx --from "twine==${TWINE_VERSION}" twine check dist/client/* dist/cli/*

      - name: Publish aplexer-client to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/client/

      - name: Publish dependent aplexer CLI to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/cli/
