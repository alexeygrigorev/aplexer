name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml and python-cli/pyproject.toml
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PYTHON_VERSION=$(grep '^version' python-cli/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Tag version:    $TAG"
          echo "Cargo version:  $CARGO_VERSION"
          echo "Python version: $PYTHON_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          if [ "$TAG" != "$PYTHON_VERSION" ]; then
            echo "::error::Tag v$TAG does not match python-cli/pyproject.toml version $PYTHON_VERSION"
            exit 1
          fi
          echo "All versions match: $TAG"

  test:
    name: Test
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --release --verbose

      # NOTE: `cargo fmt --check` and `cargo clippy -D warnings` are not run
      # as a release gate yet -- the tree currently has pre-existing fmt
      # diffs and clippy findings unrelated to packaging/release, and this
      # workflow shouldn't block the first tag on unrelated cleanup. Add
      # them here once the tree is clean.

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run aplexer-client Python tests
        working-directory: python
        run: uv run --with pytest python -m pytest -q

      - name: Run aplexer (CLI wrapper) Python tests
        working-directory: python-cli
        run: uv run --with pytest python -m pytest -q

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux-amd64
            use_cross: false

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: linux-arm64
            use_cross: true

          - name: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            asset_name: darwin-amd64
            use_cross: false
            skip_verify: true

          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: darwin-arm64
            use_cross: false

          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-amd64
            use_cross: false

          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: windows-arm64
            use_cross: false
            skip_verify: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binaries (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binaries run --version
        if: ${{ !matrix.use_cross && !matrix.skip_verify }}
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          "./target/${{ matrix.target }}/release/a$suffix" --version
          "./target/${{ matrix.target }}/release/aplexer$suffix" --version

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p staging
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "./target/${{ matrix.target }}/release/a$suffix" "staging/a$suffix"
          cp "./target/${{ matrix.target }}/release/aplexer$suffix" "staging/aplexer$suffix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplexer-bins-${{ matrix.asset_name }}
          path: staging/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Rename binaries for release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/aplexer-bins-*; do
            platform="${dir#artifacts/aplexer-bins-}"
            for f in "$dir"/*; do
              base=$(basename "$f")
              if [[ "$base" == *.exe ]]; then
                cp "$f" "release-assets/${base%.exe}-${platform}.exe"
              else
                cp "$f" "release-assets/${base}-${platform}"
              fi
            done
          done
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Build platform-tagged wheels
        run: uv run python scripts/build-wheels.py --binaries-dir ./artifacts --output-dir ./dist

      - name: List wheels
        run: ls -la dist/

      - name: Install twine
        run: uv pip install twine --system

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: uv run twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Build platform-tagged wheels
        run: uv run python scripts/build-wheels.py --binaries-dir ./artifacts --output-dir ./dist

      - name: List wheels
        run: ls -la dist/

      - name: Install twine
        run: uv pip install twine --system

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv run twine upload dist/*.whl
