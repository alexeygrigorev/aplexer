name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Two deliberately different Rust pins.
  #
  # RUST_VERSION is the MSRV, and is the same pin release.yml uses: Cargo.lock
  # resolves edition-2024 dependencies whose MSRV is 1.85, and Cargo.toml
  # declares `rust-version = "1.85"`. It is what the `msrv` job compiles with.
  #
  # RUST_LINT_VERSION is the toolchain the tree is actually lint-clean under,
  # and it is deliberately NOT the MSRV. clippy's default lint set moves
  # between releases: measured on 2026-09-07 against this tree,
  # `cargo +1.85.0 clippy --all-targets -- -D warnings` fails the lib on two
  # lints (`collapsible_else_if` and `format_collect`) that 1.95 does not
  # raise, so pinning the style gate to the MSRV would have landed this
  # workflow red on arrival. rustfmt happened to agree across 1.85, 1.95 and
  # 1.97, but it is the same class of moving target and belongs on the same
  # pin. Pinning an exact stable rather than the `stable` channel keeps a new
  # clippy release from reddening main with no commit behind it; bumping this
  # is then a visible, reviewable change.
  RUST_VERSION: "1.85.0"
  RUST_LINT_VERSION: "1.95.0"
  UV_VERSION: "0.12.5"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_LINT_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `scripts/validate.sh` runs the Python suites through `python3` when
      # pytest is importable there and falls back to `uv run --frozen`
      # otherwise. A setup-python interpreter ships pip and nothing else, so
      # this pair deterministically selects the uv path -- the same frozen,
      # lockfile-honouring invocation release.yml uses, which is also what
      # builds the maturin extension `python/tests` imports.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # One source of truth with the local gate: repository hygiene,
      # `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`, both
      # cargo suites through scripts/check-test-execution.sh with their
      # executed-count floors, and the python/ plus python-cli/ pytest suites.
      # Re-listing those commands in YAML is what lets CI and a laptop drift,
      # so this step is deliberately a single call.
      #
      # The floor is the point: `cargo test` exits 0 for a run that executed
      # nothing, so a suite that silently stops running has to fail here rather
      # than pass vacuously.
      #
      # Delegation-gated and manual tests stay `#[ignore]`d rather than being
      # forced to run: a GitHub-hosted runner has no cgroup-v2 delegation to
      # the running user, and this repo has no emulator/Docker cgroup lane.
      # That covers `tests/oom_isolation.rs::{three_sessions_oom_isolation,
      # worker_kill_isolation}`, `src/lib.rs`'s
      # `recorded_cgroup_observed_empty_tracks_a_real_delegated_cgroup`,
      # `tests/transcript_live.rs::transcript_follow_live_agents` (needs real
      # agent binaries) and `tests/screen_snapshot.rs::attach_round_trip_latency`
      # (a manual measurement). They still compile, and they are listed in
      # README.md's Validation section with the command that runs them. The
      # executed-count guard counts only passed+failed, never `ignored`, so
      # quarantining them can never help a collapsed suite clear the floor.
      - name: Run the local gate
        run: scripts/validate.sh

  msrv:
    name: MSRV compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      # The `validate` job lints and tests on a newer toolchain than the one
      # release.yml builds and ships with, so without this job an MSRV break
      # would again only surface when someone pushes a release tag -- the exact
      # retroactive-verification shape this workflow exists to remove. Compile
      # only: the style gate is `validate`'s job, and running the suite twice
      # buys nothing.
      - name: Compile every target at the MSRV
        run: cargo check --locked --all-targets
