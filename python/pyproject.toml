[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aplexer-client"
version = "0.1.0"
description = "Thin client for the aplexer PTY session runtime"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["aplexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
