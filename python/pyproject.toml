[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "aplexer-client"
version = "0.1.3"
description = "Python bindings for the aplexer PTY session runtime"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.maturin]
manifest-path = "../Cargo.toml"
python-source = "."
module-name = "aplexer._native"
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
