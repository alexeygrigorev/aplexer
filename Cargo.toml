[package]
name = "aplexer"
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
description = "Daemonless, durable PTY session workers for Linux"
license = "Apache-2.0"
repository = "https://example.invalid/aplexer"

[lib]
name = "aplexer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "a"
path = "src/bin/a.rs"

[[bin]]
name = "aplexer"
path = "src/bin/aplexer.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
vt100 = "0.16"
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py311"] }

[features]
default = []
python = ["dep:pyo3"]
# Enables deliberately disruptive startup fault injection used by the
# integration suite. Never enable this feature in production packages.
startup-test-hooks = []

[dev-dependencies]
tempfile = "3.10"
