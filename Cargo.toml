[package]
name = "aplexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Daemonless, durable PTY session workers for Linux"
license = "Apache-2.0"
repository = "https://example.invalid/aplexer"

[lib]
name = "aplexer"
path = "src/lib.rs"

[[bin]]
name = "a"
path = "src/bin/a.rs"

[[bin]]
name = "aplexer"
path = "src/bin/aplexer.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.10"
